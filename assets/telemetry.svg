<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 175" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d" />
      <stop offset="100%" stop-color="#0c0e14" />
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <pattern id="teleGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="0.65" fill="#334155" opacity="0.4" />
    </pattern>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SF Mono", "Geist Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, sans-serif; }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="798" height="173" rx="12" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" />
  <rect x="1" y="1" width="798" height="173" rx="12" fill="url(#teleGrid)" />

  <!-- Top Header Bar -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="6" height="6" fill="#38bdf8" rx="1" />
    <text x="16" y="7" fill="#94a3b8" font-size="10.5" font-weight="700" letter-spacing="1.5" class="mono">SYSTEM_DIAGNOSTICS // ARCHITECTURAL_TELEMETRY</text>
    <text x="752" y="7" text-anchor="end" fill="#10b981" font-size="10" font-weight="600" letter-spacing="1" class="mono">● READY</text>
  </g>
  <line x1="24" y1="42" x2="776" y2="42" stroke="#1e293b" stroke-width="1" />

  <!-- Column 1: Hardware & Runtime -->
  <g transform="translate(24, 62)">
    <text x="0" y="0" fill="#38bdf8" font-size="10" font-weight="700" letter-spacing="1.5" class="mono">01 // RUNTIME_CORE</text>
    <line x1="0" y1="6" x2="180" y2="6" stroke="url(#cyanLine)" stroke-width="1" />
    
    <text x="0" y="24" fill="#64748b" font-size="10" class="mono">ENV</text>
    <text x="50" y="24" fill="#cbd5e1" font-size="10.5" font-weight="500" class="mono">Linux 6.x · POSIX Native</text>

    <text x="0" y="44" fill="#64748b" font-size="10" class="mono">ARCH</text>
    <text x="50" y="44" fill="#cbd5e1" font-size="10.5" font-weight="500" class="mono">x86_64 · ARM64 · WASM</text>

    <text x="0" y="64" fill="#64748b" font-size="10" class="mono">FFI</text>
    <text x="50" y="64" fill="#cbd5e1" font-size="10.5" font-weight="500" class="mono">C-ABI (Rust to C/C++)</text>

    <text x="0" y="84" fill="#64748b" font-size="10" class="mono">PHIL</text>
    <text x="50" y="84" fill="#38bdf8" font-size="10.5" font-weight="500" class="mono">Mechanical Sympathy</text>
  </g>

  <!-- Divider 1 -->
  <line x1="265" y1="54" x2="265" y2="154" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Column 2: Memory & Execution -->
  <g transform="translate(285, 62)">
    <text x="0" y="0" fill="#818cf8" font-size="10" font-weight="700" letter-spacing="1.5" class="mono">02 // MEMORY &amp; EXECUTION</text>
    <line x1="0" y1="6" x2="180" y2="6" stroke="#818cf8" stroke-width="1" opacity="0.6" />

    <text x="0" y="24" fill="#64748b" font-size="10" class="mono">MODEL</text>
    <text x="55" y="24" fill="#cbd5e1" font-size="10.5" font-weight="500" class="mono">Zero-GC · Deterministic</text>

    <text x="0" y="44" fill="#64748b" font-size="10" class="mono">SIMD</text>
    <text x="55" y="44" fill="#cbd5e1" font-size="10.5" font-weight="500" class="mono">AVX2 / Vectorized Math</text>

    <text x="0" y="64" fill="#64748b" font-size="10" class="mono">BUDGET</text>
    <text x="55" y="64" fill="#cbd5e1" font-size="10.5" font-weight="500" class="mono">&lt; 16.6ms (60fps Render)</text>

    <text x="0" y="84" fill="#64748b" font-size="10" class="mono">ALLOC</text>
    <text x="55" y="84" fill="#818cf8" font-size="10.5" font-weight="500" class="mono">Arena &amp; Stack Primary</text>
  </g>

  <!-- Divider 2 -->
  <line x1="535" y1="54" x2="535" y2="154" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Column 3: Active Compilations & Protocols -->
  <g transform="translate(555, 62)">
    <text x="0" y="0" fill="#10b981" font-size="10" font-weight="700" letter-spacing="1.5" class="mono">03 // PIPELINE &amp; TRANSIT</text>
    <line x1="0" y1="6" x2="180" y2="6" stroke="#10b981" stroke-width="1" opacity="0.6" />

    <text x="0" y="24" fill="#64748b" font-size="10" class="mono">COMPILER</text>
    <text x="70" y="24" fill="#cbd5e1" font-size="10.5" font-weight="500" class="mono">AerixLang ➔ C99 Target</text>

    <text x="0" y="44" fill="#64748b" font-size="10" class="mono">TRANSIT</text>
    <text x="70" y="44" fill="#cbd5e1" font-size="10.5" font-weight="500" class="mono">WebRTC DataChannels</text>

    <text x="0" y="64" fill="#64748b" font-size="10" class="mono">CRYPTO</text>
    <text x="70" y="64" fill="#cbd5e1" font-size="10.5" font-weight="500" class="mono">E2EE Key Emulation</text>

    <text x="0" y="84" fill="#64748b" font-size="10" class="mono">GRAPHICS</text>
    <text x="70" y="84" fill="#10b981" font-size="10.5" font-weight="500" class="mono">WebGL GPU Particles</text>
  </g>
</svg>
