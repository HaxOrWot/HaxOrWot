<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 54" width="100%" height="100%">
  <defs>
    <linearGradient id="mailBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d" />
      <stop offset="100%" stop-color="#0d1411" />
    </linearGradient>
    <linearGradient id="mailBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, "SF Mono", "Geist Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Base Button -->
  <rect x="1" y="1" width="238" height="52" rx="8" fill="url(#mailBg)" stroke="url(#mailBorder)" stroke-width="1.2" />

  <!-- Mail Icon -->
  <g transform="translate(16, 17)">
    <rect width="20" height="15" rx="2" fill="none" stroke="#10b981" stroke-width="1.6"/>
    <path d="M1 2l9 7 9-7" fill="none" stroke="#10b981" stroke-width="1.6"/>
  </g>

  <!-- Labels -->
  <g transform="translate(48, 20)">
    <text x="0" y="0" fill="#10b981" font-size="8.5" font-weight="700" letter-spacing="1.5" class="mono">02 // COMMS</text>
    <text x="0" y="16" fill="#f8fafc" font-size="12" font-weight="600" class="mono">Email Direct</text>
  </g>

  <!-- Arrow -->
  <text x="216" y="32" fill="#10b981" font-size="14" font-weight="700" class="mono">↗</text>
</svg>
