<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 54" width="240" height="54">
  <defs>
    <linearGradient id="btnMailBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d" />
      <stop offset="100%" stop-color="#0d1411" />
    </linearGradient>
    <linearGradient id="btnMailBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="mailGlow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, "SF Mono", "Geist Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Base Button Plate -->
  <rect x="1" y="1" width="238" height="52" rx="10" fill="url(#btnMailBg)" stroke="url(#btnMailBorder)" stroke-width="1.2" />
  <rect x="1" y="1" width="238" height="52" rx="10" fill="url(#mailGlow)" />

  <!-- Corner Brackets -->
  <path d="M 6 12 L 6 6 L 12 6" stroke="#10b981" stroke-width="1.2" fill="none" opacity="0.8" />
  <path d="M 234 42 L 234 48 L 228 48" stroke="#10b981" stroke-width="1.2" fill="none" opacity="0.8" />

  <!-- Mail Icon -->
  <g transform="translate(18, 18)">
    <rect width="18" height="14" rx="2" fill="none" stroke="#10b981" stroke-width="1.6"/>
    <path d="M1 2l8 6 8-6" fill="none" stroke="#10b981" stroke-width="1.6"/>
  </g>

  <!-- Typography -->
  <g transform="translate(50, 21)">
    <text x="0" y="0" fill="#10b981" font-size="8.5" font-weight="700" letter-spacing="1.5" class="mono">02 // DIRECT_COMMS</text>
    <text x="0" y="16" fill="#f8fafc" font-size="12" font-weight="600" class="mono">Send Direct Mail</text>
  </g>

  <!-- Indicator Arrow -->
  <g transform="translate(210, 27)">
    <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
    <text x="0" y="3.5" text-anchor="middle" fill="#10b981" font-size="10" font-weight="700" class="mono">↗</text>
  </g>
</svg>
