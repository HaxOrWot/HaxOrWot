    <text x="14" y="8" fill="#38bdf8" font-size="10" font-weight="700" letter-spacing="1.5" class="mono">01 // SYSTEMS</text>
    <text x="160" y="8" fill="#f8fafc" font-size="11" font-weight="500" class="mono">Rust · C · C++ · WebAssembly (WASM) · Linux POSIX · VHDL</text>
    <rect x="680" y="-1" width="56" height="13" rx="3" fill="#1e293b" />
    <rect x="680" y="-1" width="52" height="13" rx="3" fill="#38bdf8" opacity="0.85" />
    <text x="708" y="9" text-anchor="middle" fill="#020617" font-size="8.5" font-weight="800" class="mono">96%</text>
  </g>

  <!-- Section 2: Graphics & 3D -->
  <g transform="translate(24, 108)">
    <rect x="0" y="-14" width="752" height="34" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" opacity="0.6" />
    <text x="14" y="8" fill="#818cf8" font-size="10" font-weight="700" letter-spacing="1.5" class="mono">02 // GRAPHICS</text>
    <text x="160" y="8" fill="#f8fafc" font-size="11" font-weight="500" class="mono">Next.js 16 · React 19 · Three.js / R3F · GLSL Shaders · Tailwind v4</text>
    <rect x="680" y="-1" width="56" height="13" rx="3" fill="#1e293b" />
    <rect x="680" y="-1" width="50" height="13" rx="3" fill="#818cf8" opacity="0.85" />
    <text x="708" y="9" text-anchor="middle" fill="#020617" font-size="8.5" font-weight="800" class="mono">92%</text>
