    <text x="14" y="8" fill="#c084fc" font-size="10" font-weight="700" letter-spacing="1.5" class="mono">04 // SECURITY</text>
    <text x="160" y="8" fill="#f8fafc" font-size="11" font-weight="500" class="mono">Cryptographic Resilience · Threat Emulation · Kali Linux · Python AI</text>
