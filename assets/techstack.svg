    <text x="14" y="8" fill="#10b981" font-size="10" font-weight="700" letter-spacing="1.5" class="mono">03 // PROTOCOLS</text>
    <text x="160" y="8" fill="#f8fafc" font-size="11" font-weight="500" class="mono">WebRTC DataChannels · Supabase Realtime · PostgreSQL · Docker · Git</text>
    <rect x="680" y="-1" width="56" height="13" rx="3" fill="#1e293b" />
    <rect x="680" y="-1" width="48" height="13" rx="3" fill="#10b981" opacity="0.85" />
    <text x="708" y="9" text-anchor="middle" fill="#020617" font-size="8.5" font-weight="800" class="mono">88%</text>
