<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 155" width="100%" height="100%">
  <defs>
    <linearGradient id="beamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d" />
      <stop offset="100%" stop-color="#0e1019" />
    </linearGradient>
    <radialGradient id="beamGlow" cx="85%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="cardDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.6" fill="#334155" opacity="0.35" />
    </pattern>
  </defs>
  <style>
    .mono { font-family: ui-monospace, "SF Mono", "Geist Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, sans-serif; }
  </style>

  <rect x="1" y="1" width="388" height="153" rx="10" fill="url(#beamBg)" stroke="#1e293b" stroke-width="1.2" />
  <rect x="1" y="1" width="388" height="153" rx="10" fill="url(#cardDots)" />
  <rect x="1" y="1" width="388" height="153" rx="10" fill="url(#beamGlow)" />

  <!-- Corner Brackets -->
  <path d="M 8 18 L 8 8 L 18 8" stroke="#818cf8" stroke-width="1.4" fill="none" opacity="0.7" />
  <path d="M 382 18 L 382 8 L 372 8" stroke="#818cf8" stroke-width="1.4" fill="none" opacity="0.7" />

  <!-- Top Category -->
  <g transform="translate(20, 24)">
    <text x="0" y="0" fill="#818cf8" font-size="9" font-weight="700" letter-spacing="1.5" class="mono">NETWORKING // E2EE PROTOCOL</text>
    <circle cx="348" cy="-3" r="3" fill="#10b981" />
  </g>

  <!-- Title & Description -->
  <g transform="translate(20, 52)">
    <text x="0" y="0" fill="#ffffff" font-size="19" font-weight="700" letter-spacing="-0.3" class="sans">BEAM</text>
    <text x="0" y="18" fill="#94a3b8" font-size="11" font-weight="400" class="sans">Direct peer-to-peer transit to cryptographic @handles.</text>
  </g>

  <!-- Protocol Box -->
  <g transform="translate(20, 88)">
    <rect x="0" y="0" width="350" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="12" y="15" fill="#818cf8" font-size="9.5" font-weight="600" class="mono">@PEER_A</text>
    <text x="68" y="15" fill="#475569" font-size="9.5" class="mono">⟵</text>
    <text x="88" y="15" fill="#10b981" font-size="9.5" font-weight="600" class="mono">WebRTC DataChannel</text>
    <text x="238" y="15" fill="#475569" font-size="9.5" class="mono">⟶</text>
    <text x="258" y="15" fill="#818cf8" font-size="9.5" font-weight="600" class="mono">@PEER_B</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(20, 134)">
    <text x="0" y="0" fill="#64748b" font-size="9" font-weight="600" letter-spacing="1" class="mono">[NEXTJS_16]</text>
    <text x="75" y="0" fill="#64748b" font-size="9" font-weight="600" letter-spacing="1" class="mono">[SUPABASE_REALTIME]</text>
    <text x="210" y="0" fill="#64748b" font-size="9" font-weight="600" letter-spacing="1" class="mono">[ZERO_KNOWLEDGE]</text>
    <text x="350" y="0" text-anchor="end" fill="#818cf8" font-size="9" font-weight="600" class="mono">↗</text>
  </g>
</svg>
