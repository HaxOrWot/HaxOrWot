<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#0e0e13" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="glow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#52525b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#52525b" opacity="0.3" />
    </pattern>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d4d4d8" />
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "Geist Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, Arial, sans-serif; }
    .status-pulse {
      animation: pulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="798" height="218" rx="14" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="1.2" />
  <rect x="1" y="1" width="798" height="218" rx="14" fill="url(#dotGrid)" />
  <rect x="1" y="1" width="798" height="218" rx="14" fill="url(#glow)" />

  <!-- Top Status Bar -->
  <g transform="translate(36, 38)">
    <circle cx="0" cy="0" r="3.5" fill="#10b981" class="status-pulse" />
    <text x="14" y="3.5" fill="#71717a" font-size="11" font-weight="600" letter-spacing="1.5" class="mono">PHOENIX // ARCHITECTURE_ONLINE</text>
    <text x="728" y="3.5" text-anchor="end" fill="#52525b" font-size="10" font-weight="500" letter-spacing="2" class="mono">BUILD: NATIVE</text>
  </g>

  <!-- Divider Line -->
  <line x1="36" y1="56" x2="764" y2="56" stroke="#27272a" stroke-width="0.8" opacity="0.6" />

  <!-- Main Hero Typography -->
  <g transform="translate(36, 114)">
    <text x="0" y="0" fill="url(#titleGrad)" font-size="34" font-weight="700" letter-spacing="-0.8" class="sans">Phoenix</text>
    <text x="144" y="-3" fill="#71717a" font-size="15" font-weight="400" class="mono">/ notphoenixx</text>
    <text x="0" y="30" fill="#a1a1aa" font-size="14" font-weight="400" letter-spacing="0.2" class="sans">
      Systems Software Engineer &amp; Graphics Developer
    </text>
    <text x="0" y="52" fill="#52525b" font-size="12" font-weight="400" letter-spacing="0.5" class="mono">
      Compilers · 3D Physics · Encrypted WebRTC · Deterministic Performance
    </text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="36" y1="202" x2="764" y2="202" stroke="url(#lineGrad)" stroke-width="1.5" />
</svg>
