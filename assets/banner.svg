<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d" />
      <stop offset="50%" stop-color="#0d0f17" />
      <stop offset="100%" stop-color="#07080b" />
    </linearGradient>

    <!-- Ambient Illumination -->
    <radialGradient id="cyanGlow" cx="20%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#c084fc" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="25%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="75%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="hudGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.75" fill="#334155" opacity="0.45" />
    </pattern>

    <!-- Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Scanline Gradient -->
    <linearGradient id="scanlineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Accent Line -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SF Mono", "Geist Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, sans-serif; }
    
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    @keyframes scan {
      0% { transform: translateY(0); }
      100% { transform: translateY(240px); }
    }
    .hud-pulse { animation: pulse-ring 2.8s ease-in-out infinite; transform-origin: 36px 36px; }
  </style>

  <!-- Base Plate & Textures -->
  <rect x="1" y="1" width="798" height="248" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />
  <rect x="1" y="1" width="798" height="248" rx="16" fill="url(#hudGrid)" />
  <rect x="1" y="1" width="798" height="248" rx="16" fill="url(#cyanGlow)" />
  <rect x="1" y="1" width="798" height="248" rx="16" fill="url(#purpleGlow)" />

  <!-- Corner HUD Brackets -->
  <path d="M 12 28 L 12 12 L 28 12" stroke="#38bdf8" stroke-width="1.8" fill="none" opacity="0.8" />
  <path d="M 788 28 L 788 12 L 772 12" stroke="#818cf8" stroke-width="1.8" fill="none" opacity="0.8" />
  <path d="M 12 222 L 12 238 L 28 238" stroke="#38bdf8" stroke-width="1.8" fill="none" opacity="0.8" />
  <path d="M 788 222 L 788 238 L 772 238" stroke="#818cf8" stroke-width="1.8" fill="none" opacity="0.8" />

  <!-- Top Telemetry Header -->
  <g transform="translate(36, 38)">
    <circle cx="0" cy="0" r="4" fill="#10b981" />
    <circle cx="0" cy="0" r="7" stroke="#10b981" stroke-width="1" fill="none" class="hud-pulse" />
    <text x="16" y="3.5" fill="#38bdf8" font-size="10.5" font-weight="700" letter-spacing="2" class="mono">PHOENIX_ARCH // CORE_01</text>
    <text x="210" y="3.5" fill="#475569" font-size="10" letter-spacing="1" class="mono">|  TARGET: x86_64-NATIVE</text>
    <text x="390" y="3.5" fill="#475569" font-size="10" letter-spacing="1" class="mono">|  LATENCY: 0.12ms</text>
    <text x="728" y="3.5" text-anchor="end" fill="#64748b" font-size="10" font-weight="600" letter-spacing="1.5" class="mono">[SYSTEMS_ONLINE]</text>
  </g>

  <!-- Hairline Header Divider -->
  <line x1="36" y1="56" x2="764" y2="56" stroke="#1e293b" stroke-width="1" />
  <circle cx="36" cy="56" r="1.5" fill="#38bdf8" />
  <circle cx="764" cy="56" r="1.5" fill="#818cf8" />

  <!-- Main Hero Display -->
  <g transform="translate(36, 122)">
    <text x="0" y="0" fill="url(#textGrad)" font-size="38" font-weight="800" letter-spacing="-1" class="sans">Phoenix</text>
    <text x="168" y="-5" fill="#64748b" font-size="15" font-weight="500" class="mono">/ notphoenixx</text>
    <rect x="168" y="10" width="130" height="18" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="174" y="22.5" fill="#38bdf8" font-size="9.5" font-weight="600" letter-spacing="1" class="mono">⚡ LOW-LEVEL &amp; 3D</text>

    <text x="0" y="36" fill="#94a3b8" font-size="14.5" font-weight="400" letter-spacing="0.2" class="sans">
      Systems Software Engineer &amp; Real-Time Graphics Developer
    </text>
    <text x="0" y="60" fill="#64748b" font-size="11.5" font-weight="400" letter-spacing="0.4" class="mono">
      Compilers (AerixLang) · 3D Physics (EngineLib) · WebRTC (BEAM) · WebGL Shaders
    </text>
  </g>

  <!-- Bottom Accent Separator -->
  <line x1="36" y1="208" x2="764" y2="208" stroke="url(#accentLine)" stroke-width="1.6" />

  <!-- Micro Footer Telemetry -->
  <g transform="translate(36, 228)">
    <text x="0" y="0" fill="#475569" font-size="9.5" font-weight="500" letter-spacing="1.5" class="mono">STATUS: ZERO_GC_RUNTIME</text>
    <text x="240" y="0" fill="#475569" font-size="9.5" font-weight="500" letter-spacing="1.5" class="mono">PIPELINE: C99 / LLVM_IR</text>
    <text x="490" y="0" fill="#475569" font-size="9.5" font-weight="500" letter-spacing="1.5" class="mono">SECURITY: E2EE_VERIFIED</text>
    <text x="728" y="0" text-anchor="end" fill="#38bdf8" font-size="9.5" font-weight="600" letter-spacing="1.5" class="mono">0x7F_PHOENIX</text>
  </g>
</svg>
