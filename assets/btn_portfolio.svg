<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 54" width="240" height="54">
  <defs>
    <linearGradient id="btnPortBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d" />
      <stop offset="100%" stop-color="#10101c" />
    </linearGradient>
    <linearGradient id="btnPortBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="portGlow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, "SF Mono", "Geist Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Base Button Plate -->
  <rect x="1" y="1" width="238" height="52" rx="10" fill="url(#btnPortBg)" stroke="url(#btnPortBorder)" stroke-width="1.2" />
  <rect x="1" y="1" width="238" height="52" rx="10" fill="url(#portGlow)" />

  <!-- Corner Brackets -->
  <path d="M 6 12 L 6 6 L 12 6" stroke="#818cf8" stroke-width="1.2" fill="none" opacity="0.8" />
  <path d="M 234 42 L 234 48 L 228 48" stroke="#818cf8" stroke-width="1.2" fill="none" opacity="0.8" />

  <!-- 3D Isometric Cube Icon -->
  <g transform="translate(18, 17)">
