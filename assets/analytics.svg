<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 185" width="100%" height="100%">
  <defs>
    <linearGradient id="anaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d" />
      <stop offset="100%" stop-color="#0c0e14" />
    </linearGradient>
    <linearGradient id="anaBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <pattern id="anaGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="0.65" fill="#334155" opacity="0.35" />
    </pattern>

    <!-- Bar Gradients -->
    <linearGradient id="rustBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="tsBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <linearGradient id="cBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>
    <linearGradient id="pyBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SF Mono", "Geist Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, sans-serif; }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="798" height="183" rx="12" fill="url(#anaBg)" stroke="url(#anaBorder)" stroke-width="1.2" />
  <rect x="1" y="1" width="798" height="183" rx="12" fill="url(#anaGrid)" />

  <!-- Top Header Bar -->
  <g transform="translate(24, 28)">
    <circle cx="0" cy="0" r="3.5" fill="#10b981" />
    <text x="14" y="3.5" fill="#94a3b8" font-size="10.5" font-weight="700" letter-spacing="1.5" class="mono">TELEMETRY_ANALYTICS // WORKLOAD_SPECTRUM</text>
    <text x="752" y="3.5" text-anchor="end" fill="#38bdf8" font-size="9.5" font-weight="600" letter-spacing="1.5" class="mono">[LIVE_ENGINE: ONLINE]</text>
  </g>
  <line x1="24" y1="42" x2="776" y2="42" stroke="#1e293b" stroke-width="1" />

  <!-- Left Column: Core Metrics -->
  <g transform="translate(24, 66)">
    <text x="0" y="0" fill="#38bdf8" font-size="10" font-weight="700" letter-spacing="1.5" class="mono">01 // REPOSITORY TELEMETRY</text>
    <line x1="0" y1="6" x2="220" y2="6" stroke="#38bdf8" stroke-width="1" opacity="0.4" />

    <g transform="translate(0, 26)">
      <text x="0" y="0" fill="#64748b" font-size="10" class="mono">REPOSITORIES</text>
      <text x="120" y="0" fill="#f8fafc" font-size="11" font-weight="600" class="mono">14 Projects</text>
    </g>

    <g transform="translate(0, 48)">
      <text x="0" y="0" fill="#64748b" font-size="10" class="mono">PRIMARY DOMAIN</text>
      <text x="120" y="0" fill="#cbd5e1" font-size="11" font-weight="500" class="mono">Systems &amp; Real-time 3D</text>
    </g>

    <g transform="translate(0, 70)">
      <text x="0" y="0" fill="#64748b" font-size="10" class="mono">ENGINE CYCLE</text>
      <text x="120" y="0" fill="#10b981" font-size="11" font-weight="600" class="mono">Deterministic (Zero-GC)</text>
    </g>

    <g transform="translate(0, 92)">
      <text x="0" y="0" fill="#64748b" font-size="10" class="mono">SECURITY GRADE</text>
      <text x="120" y="0" fill="#38bdf8" font-size="11" font-weight="600" class="mono">A+ (E2EE Verified)</text>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="330" y1="54" x2="330" y2="168" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Right Column: Language Distribution & Workload -->
  <g transform="translate(360, 66)">
    <text x="0" y="0" fill="#818cf8" font-size="10" font-weight="700" letter-spacing="1.5" class="mono">02 // CODEBASE LANGUAGE SPECTRUM</text>
    <line x1="0" y1="6" x2="260" y2="6" stroke="#818cf8" stroke-width="1" opacity="0.4" />

    <!-- Rust -->
    <g transform="translate(0, 24)">
      <text x="0" y="0" fill="#cbd5e1" font-size="10" font-weight="600" class="mono">Rust (Physics &amp; Core Engine)</text>
      <text x="390" y="0" text-anchor="end" fill="#38bdf8" font-size="10" font-weight="700" class="mono">34%</text>
      <rect x="0" y="5" width="390" height="6" rx="3" fill="#1e293b" />
      <rect x="0" y="5" width="132" height="6" rx="3" fill="url(#rustBar)" />
    </g>

    <!-- TypeScript / 3D -->
    <g transform="translate(0, 48)">
      <text x="0" y="0" fill="#cbd5e1" font-size="10" font-weight="600" class="mono">TypeScript / WebGL (Next 16, R3F)</text>
      <text x="390" y="0" text-anchor="end" fill="#818cf8" font-size="10" font-weight="700" class="mono">28%</text>
      <rect x="0" y="5" width="390" height="6" rx="3" fill="#1e293b" />
      <rect x="0" y="5" width="109" height="6" rx="3" fill="url(#tsBar)" />
    </g>

    <!-- C / C++ -->
    <g transform="translate(0, 72)">
      <text x="0" y="0" fill="#cbd5e1" font-size="10" font-weight="600" class="mono">C / C++ (C99 Codegen &amp; Systems)</text>
      <text x="390" y="0" text-anchor="end" fill="#c084fc" font-size="10" font-weight="700" class="mono">22%</text>
      <rect x="0" y="5" width="390" height="6" rx="3" fill="#1e293b" />
      <rect x="0" y="5" width="85" height="6" rx="3" fill="url(#cBar)" />
    </g>

    <!-- Python -->
    <g transform="translate(0, 96)">
      <text x="0" y="0" fill="#cbd5e1" font-size="10" font-weight="600" class="mono">Python (AI Pathfinding &amp; Tooling)</text>
      <text x="390" y="0" text-anchor="end" fill="#10b981" font-size="10" font-weight="700" class="mono">16%</text>
      <rect x="0" y="5" width="390" height="6" rx="3" fill="#1e293b" />
      <rect x="0" y="5" width="62" height="6" rx="3" fill="url(#pyBar)" />
    </g>
  </g>
</svg>
